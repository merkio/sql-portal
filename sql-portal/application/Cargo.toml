[package]
name = "sql-portal-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
sql-portal-domain = { path = "../domain" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
sql-portal-testing = { path = "../testing" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
