<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} · {{ ui_title }}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="/">{{ ui_title }}</a>
    {% if nav %}
    <div class="who">
      <span class="user" title="Signed in">{{ nav.display_name }}</span>
      {% if nav.logout_csrf %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ nav.logout_csrf }}">
        <button class="ghost" type="submit">Sign out</button>
      </form>
      {% endif %}
    </div>
    {% endif %}
  </header>
  <main id="main" class="container">
    {{ body|safe }}
  </main>
  {% if with_charts %}<script src="{{ chartjs_url|safe }}" defer></script>{% endif %}
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
</body>
</html>
