[package]
name = "sql-portal-domain"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
sql-executor = { path = "../../datasources/sql-executor" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
