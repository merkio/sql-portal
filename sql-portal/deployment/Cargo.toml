[package]
name = "sql-portal"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Config-driven SQL script portal with LDAP/OIDC authorization, forms, charts, health checks and Prometheus metrics"
license = "MIT"
publish = false

[[bin]]
name = "script-portal"
path = "src/main.rs"

[features]
# Exposes in-memory fakes to integration tests.
test-support = []

[dependencies]
sql-portal-domain = { path = "../domain" }
sql-portal-application = { path = "../application" }
sql-portal-adapters = { path = "../adapters" }
sql-portal-ui = { path = "../ui" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.5"
serde_yaml_ng = "0.10"
