[package]
name = "sql-portal-adapters"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
sql-portal-domain = { path = "../domain" }
sql-executor = { path = "../../datasources/sql-executor" }
sqlite-dialect = { path = "../../datasources/sqlite" }
postgres-dialect = { path = "../../datasources/postgres" }
clickhouse-dialect = { path = "../../datasources/clickhouse" }
tls-config = { path = "../../common/tls", features = ["reqwest"] }
anyhow = "1"
async-trait = "0.1"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
openidconnect = "4.1"
regex = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
url = "2"
percent-encoding = "2"
futures-util = "0.3"

[dev-dependencies]
sql-portal-testing = { path = "../testing" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
