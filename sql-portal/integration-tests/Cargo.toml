[package]
name = "sql-portal-integration-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Integration and end-to-end tests of the SQL Portal"
publish = false

[features]
# Tests that start Docker containers (PostgreSQL, ClickHouse, the portal image).
# Requires a Docker-compatible engine (DOCKER_HOST is honoured, e.g. Podman).
docker = ["dep:testcontainers-modules", "dep:reqwest", "dep:uuid"]

[dependencies]
sql-portal = { path = "../deployment" }
sql-portal-adapters = { path = "../adapters" }
sql-portal-application = { path = "../application" }
sql-portal-domain = { path = "../domain" }
sql-portal-testing = { path = "../testing" }
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
serde_json = "1"
serde_yaml_ng = "0.10"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

# docker feature
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
testcontainers-modules = { version = "0.15", features = ["postgres", "clickhouse"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
