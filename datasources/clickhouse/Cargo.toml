[package]
name = "clickhouse-dialect"
version = "0.1.0"
edition = "2021"
description = "ClickHouse dialect for sql-dialect: typed server-side parameters and JSONCompact results"
license = "MIT"
publish = false

[dependencies]
sql-executor = { path = "../sql-executor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
url = "2"
