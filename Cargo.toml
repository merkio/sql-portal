[workspace]
resolver = "2"
members = [
    # Common utilities
    "common/template-render",
    "common/config-loader",
    "common/tls",
    
    # Datasources
    "datasources/sql-executor",
    "datasources/sqlite",
    "datasources/postgres",
    "datasources/clickhouse",
    
    # SQL Portal application
    "sql-portal/domain",
    "sql-portal/application",
    "sql-portal/adapters",
    "sql-portal/ui",
    "sql-portal/deployment",
    "sql-portal/testing",
    "sql-portal/integration-tests",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
