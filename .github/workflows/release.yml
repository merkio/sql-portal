name: Release

# Publishes binaries to the GitHub release and the Docker image to Docker Hub
# when a version tag (v1.2.3, v1.2.3-rc.1) is pushed.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME   Docker Hub user or organisation
#   DOCKERHUB_TOKEN      Docker Hub access token with read/write scope
# Optional repository variable:
#   DOCKERHUB_REPOSITORY image name, defaults to <DOCKERHUB_USERNAME>/script-portal

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag must match Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$tag" != "$crate" ]; then
            echo "Tag ($tag) does not match Cargo.toml version ($crate)" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked

  binaries:
    name: Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="script-portal-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          exe=script-portal
          [ "${{ matrix.archive }}" = "zip" ] && exe=script-portal.exe
          cp "target/${{ matrix.target }}/release/$exe" "$name/"
          cp -r config README.md LICENSE "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"
          else shasum -a 256 "$file" > "$file.sha256"; fi
          echo "ASSET=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Docker image (Docker Hub)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/script-portal', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/script-portal', secrets.DOCKERHUB_USERNAME) }}
          readme-filepath: ./README.md
